<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Set a new password for your Gignary account.">
<style>:root{--bg:#FFFFFF;--bg-soft:#EAF7EF;--bg-soft-2:#F5FBF7;--forest:#0B3D2E;--ink:#122019;--green:#167A43;--green-dark:#125F35;--green-bright:#33C46D;--sage:#4F6B5C;--line:#DCEEE3;--line-strong:#BFDDCB;--white:#FFFFFF;--danger:#B4463A;--shadow:0 8px 30px rgba(11,61,46,.08);--shadow-lift:0 16px 40px rgba(11,61,46,.14);--radius:18px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Fraunces',serif;color:var(--forest);letter-spacing:-.01em;margin:0}
a{color:inherit}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
img,svg,video{display:block;max-width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:11px 22px;font-size:14.5px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 6px 18px rgba(22,122,67,.3)}
.btn-ghost{background:transparent;color:var(--forest);border:1.5px solid var(--line-strong)}
.btn-block{width:100%}
.btn-sm{padding:8px 16px;font-size:13.5px}
.logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:22px;font-weight:600;color:var(--forest);text-decoration:none}
.logo-mark{width:30px;height:30px;flex:none}
.top-simple{display:flex;align-items:center;justify-content:space-between;padding:24px 0}
.top-simple nav{display:flex;gap:14px}
.auth-view{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-soft-2);padding:40px 20px}
.auth-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lift);padding:40px;width:100%;max-width:420px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1180px;margin:0 auto;padding:14px 32px;display:grid;grid-template-columns:1fr minmax(220px,460px) 1fr;align-items:center;gap:20px}
</style>
<title>Reset password — Gignary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preload" as="style" href="style.css">
<link href="style.css" rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;">
<noscript><link href="style.css" rel="stylesheet"></noscript>
</head>
<body>
<main class="auth-view" style="min-height:100vh;">
  <div class="auth-card">
    <a class="logo" href="index.html" style="justify-content:center;">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="#167A43" stroke-width="2.4"/><circle cx="20" cy="20" r="11.5" stroke="#167A43" stroke-width="2.4" opacity="0.6"/><circle cx="20" cy="20" r="5" fill="#167A43"/></svg>
      Gignary
    </a>
    <div class="auth-head">
      <h2 style="font-size:24px;">Set a new password</h2>
      <p id="resetNote">Choose a new password for your account.</p>
    </div>
    <form id="resetForm">
      <div class="field"><label for="rsPass">New password</label><input type="password" id="rsPass" required minlength="6" placeholder="At least 6 characters"></div>
      <div class="field"><label for="rsPass2">Confirm new password</label><input type="password" id="rsPass2" required placeholder="Re-enter password"></div>
      <button type="submit" class="btn btn-primary btn-block">Save new password</button>
    </form>
    <p class="auth-switch"><a href="login.html">Back to log in</a></p>
  </div>
</main>
<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script>
  const rp = new URLSearchParams(window.location.hash.substring(1));
  const resetToken = rp.get('access_token');
  const form = document.getElementById('resetForm');
  if(!resetToken || rp.get('type') !== 'recovery'){
    form.hidden = true;
    document.getElementById('resetNote').textContent = 'This reset link is invalid or has expired. Go back to log in and use "Forgot password?" to get a new one.';
  } else {
    accessToken = resetToken;
    history.replaceState(null, '', window.location.pathname);
  }
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = document.getElementById('rsPass').value, p2 = document.getElementById('rsPass2').value;
    if(p1 !== p2){ showToast("Passwords don't match.", true); return; }
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Saving...';
    const { error } = await sbUpdateUser({ password: p1 });
    if(error){ btn.disabled = false; btn.textContent = 'Save new password'; showToast('Could not save password: ' + errMsg(error), true); return; }
    clearSession();
    showToast('Password updated. Redirecting to log in...');
    setTimeout(() => { location.href = 'login.html'; }, 1500);
  });
</script>
</body>
</html>
