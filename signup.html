<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Create your account — Gignary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="auth-view" style="min-height:100vh;">
  <div class="auth-card">
    <a class="logo" href="#" style="justify-content:center;">
      <svg class="logo-mark" viewBox="0 0 40 40" fill="none"><circle cx="20" cy="20" r="18" stroke="#1F9D55" stroke-width="2.4"/><circle cx="20" cy="20" r="11.5" stroke="#1F9D55" stroke-width="2.4" opacity="0.6"/><circle cx="20" cy="20" r="5" fill="#1F9D55"/></svg>
      Gignary
    </a>
    <div class="auth-head">
      <h2 style="font-size:24px;">Create your account</h2>
      <p>Start browsing gigs and tracking your orders.</p>
    </div>
    <form id="signupForm">
      <div class="field"><label for="suName">Full name</label><input type="text" id="suName" required placeholder="Enter name"></div>
      <div class="field"><label for="suEmail">Email</label><input type="email" id="suEmail" required placeholder="you@example.com"></div>
      <div class="field"><label for="suPass">Password</label><input type="password" id="suPass" required placeholder="Create a password"></div>
      <div class="field"><label for="suPass2">Confirm password</label><input type="password" id="suPass2" required placeholder="Re-enter password"></div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>
    <div class="auth-divider">or</div>
    <button type="button" class="btn-google" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.5 4.5 24 4.5 12.7 4.5 3.5 13.7 3.5 25S12.7 45.5 24 45.5 44.5 36.3 44.5 25c0-1.5-.2-3-.9-4.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.5 29.5 4.5 24 4.5c-7.7 0-14.4 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 45.5c5.4 0 10.3-1.8 14-4.9l-6.5-5.4c-2 1.4-4.6 2.3-7.5 2.3-5.3 0-9.7-3.1-11.3-7.6l-6.5 5C9.5 41 16.2 45.5 24 45.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.2 5.7l6.5 5.4C39.5 37.5 44.5 32 44.5 25c0-1.5-.2-3-.9-4.5z"/></svg>
      Continue with Google
    </button>
    <p class="auth-switch">Already have an account? <a onclick="location.href='login.html'">Log in</a></p>
  </div>
</section>
<div class="toast" id="toast"></div>
<script src="shared.js"></script>
<script>
  const existing = loadSession();
  if(existing && existing.user){ location.href = 'dashboard.html'; }

  document.getElementById('signupForm').addEventListener('submit', async e => {
    e.preventDefault();
    const p1 = document.getElementById('suPass').value;
    const p2 = document.getElementById('suPass2').value;
    if(p1 !== p2){ showToast("Passwords don't match.", true); return; }
    const name = document.getElementById('suName').value.trim() || 'Buyer';
    const email = document.getElementById('suEmail').value.trim();
    const btn = e.target.querySelector('button[type=submit]');
    const originalLabel = btn.textContent;
    btn.disabled = true; btn.textContent = 'Creating account...';

    try{
      const { data, error } = await sbSignUp(email, p1, name);
      btn.disabled = false; btn.textContent = originalLabel;
      if(error){ showToast('Could not create account: ' + errMsg(error), true); return; }

      if(data.access_token){
        const user = { id: data.user.id, name, email, avatarUrl: null };
        saveSession(user, data.access_token, data.refresh_token, data.expires_in);
        try{ localStorage.setItem('gignary_just_signed_up', '1'); }catch(e){}
        location.href = 'dashboard.html';
      } else {
        showToast('Account created! Check your email (' + email + ') to confirm, then log in.');
        e.target.reset();
        setTimeout(() => { location.href = 'login.html'; }, 1800);
      }
    } catch(err){
      btn.disabled = false; btn.textContent = originalLabel;
      showToast('Connection error while creating account: ' + err.message, true);
    }
  });
</script>
</body>
</html>
